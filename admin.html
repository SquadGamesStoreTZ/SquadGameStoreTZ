<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2c3240;
            background-color: #151a23;
            color: #ffffff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0022d4;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0010b3;
        }
        textarea {
            height: 140px;
            font-family: monospace;
            resize: vertical;
        }
        .copy-btn {
            background-color: #25d366;
            margin-top: 10px;
        }
        .copy-btn:hover {
            background-color: #1da851;
        }
    </style>
</head>
<body>

    <h2>Game Store Admin Generator</h2>
    <p style="color: #94a3b8; font-size: 0.85rem;">Fill in the details below to generate JSON for games with single or multiple parts:</p>

    <div class="form-group">
        <label>Game Title:</label>
        <input type="text" id="title" placeholder="e.g. GTA V (3 Parts + Mods)" required>
    </div>

    <div class="form-group">
        <label>Platform:</label>
        <select id="platform">
            <option value="PC">PC</option>
            <option value="Android">Android</option>
            <option value="PlayStation">PlayStation</option>
        </select>
    </div>

    <div class="form-group">
        <label>Category Tag:</label>
        <input type="text" id="category" placeholder="e.g. Action / Open World">
    </div>

    <div class="form-group">
        <label>Price (TZS - Numbers only):</label>
        <input type="number" id="price" placeholder="e.g. 30000" required>
    </div>

    <div class="form-group">
        <label>Description (or Parts Info):</label>
        <input type="text" id="description" placeholder="e.g. Includes Part 1, Part 2, and Custom Tanzanian Map Mod.">
    </div>

    <div class="form-group">
        <label>Image Filename:</label>
        <input type="text" id="image" placeholder="e.g. gta5.jpg">
    </div>

    <button onclick="generateJSON()">Generate Game Code</button>

    <hr style="border: 1px solid #2c3240; margin: 25px 0;">

    <div class="form-group">
        <label>Copy this into your games.json file:</label>
        <textarea id="output" readonly placeholder="// Your generated JSON code will appear here..."></textarea>
        <button class="copy-btn" onclick="copyToClipboard()">Copy JSON Code</button>
    </div>

    <script>
        function generateJSON() {
            const title = document.getElementById("title").value.trim();
            const platform = document.getElementById("platform").value;
            const category = document.getElementById("category").value.trim();
            const rawPrice = document.getElementById("price").value.trim();
            const description = document.getElementById("description").value.trim();
            const image = document.getElementById("image").value.trim();

            if (!title || !rawPrice) {
                alert("Please enter both a Game Title and Price.");
                return;
            }

            const formattedPrice = "TZS " + Number(rawPrice).toLocaleString();
            const phone = "255692752060";
            
            // Pre-fills a WhatsApp message mentioning all parts/links included
            const message = `Hello Squad Games, I want to buy ${title} (${formattedPrice}). Please send payment details and download links.`;
            const downloadUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

            const gameObject = {
                title: title,
                platform: platform,
                category: category || title,
                description: description || "Full game files, multi-part links, and setup guide included.",
                price: formattedPrice,
                image: image || "placeholder.jpg",
                downloadUrl: downloadUrl
            };

            document.getElementById("output").value = JSON.stringify(gameObject, null, 4) + ",";
        }

        function copyToClipboard() {
            const output = document.getElementById("output");
            if (!output.value) return;
            output.select();
            document.execCommand("copy");
            alert("Copied! Paste it directly into your games.json file.");
        }
    </script>
</body>
</html>
