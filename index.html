<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Games Store TZ | ETS 2 & Mobile Games</title>
    
    <meta name="description" content="Buy Euro Truck Simulator 2, Tanzanian bus mods, and mobile games with instant delivery in Tanzania via WhatsApp.">
    <meta name="keywords" content="Euro Truck Simulator 2, ETS2 Tanzania, ETS2 Mobile, Squad Games Store TZ">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #25d366;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 2rem;
            color: #ffffff;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .game-card {
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .card-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #007aff;
            color: #fff;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }
        .game-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .game-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .category-tag {
            color: #ff9500;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .game-details h3 {
            margin: 10px 0 5px 0;
            color: #ffffff;
        }
        .game-details p {
            color: var(--text-muted);
            font-size: 0.9rem;
            flex-grow: 1;
            margin: 0 0 15px 0;
        }
        .card-action {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #2c2c2e;
        }
        .price {
            font-weight: bold;
            color: #ffffff;
        }
        .btn-download {
            background: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn-download:hover {
            background: #1da851;
        }
        .footer-note {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 25px;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Squad Games Store TZ</h1>
            <p style="color: var(--text-muted); margin-top: 5px;">Download ETS 2 PC Mods, Maps & Mobile Games</p>
        </header>

        <main id="game-grid" class="game-grid">
            <p style="text-align: center; color: var(--text-muted);">Loading games...</p>
        </main>

        <footer class="footer-note">
            Squad Games Store TZ &copy; 2026. All rights reserved.
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch("./games.json")
                .then(response => {
                    if (!response.ok) throw new Error("Failed to load games.json");
                    return response.json();
                })
                .then(games => {
                    const container = document.getElementById("game-grid");
                    if (!container) return;
                    container.innerHTML = "";

                    games.forEach(game => {
                        const card = document.createElement("div");
                        card.classList.add("game-card");

                        card.innerHTML = `
                            <div class="card-badge">${game.platform || "Game"}</div>
                            <img src="${game.image}" alt="${game.title}" class="game-img" onerror="this.src='https://via.placeholder.com/300x180?text=Image+Not+Found'" />
                            <div class="game-details">
                                <span class="category-tag">${game.category || ""}</span>
                                <h3>${game.title}</h3>
                                <p>${game.description || ""}</p>
                                <div class="card-action">
                                    <span class="price">${game.price}</span>
                                    <a href="${game.downloadUrl}" target="_blank" class="btn-download">Buy Now</a>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById("game-grid").innerHTML = `<p style="text-align: center; color: #ff5252;">Error loading store items. Please check files.</p>`;
                });
        });
    </script>
</body>
</html>
