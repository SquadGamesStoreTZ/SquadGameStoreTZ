<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Games Store TZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sleek Navigation Header -->
    <header class="navbar">
        <div class="brand">
            <img src="profile.jpg" alt="Profile" class="nav-avatar" onerror="this.style.display='none';" />
            <div class="brand-text">
                <span class="brand-title">Squad Games Store TZ</span>
                <span class="brand-sub">Download ETS 2 PC Mods, Maps & Mobile Games</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="https://wa.me/255692752060" target="_blank" class="nav-btn">WhatsApp Support</a>
        </nav>
    </header>

    <div class="container">
        <!-- Trust Indicators Bar -->
        <div class="trust-bar">
            <div class="trust-item">⚡ Instant WhatsApp Delivery</div>
            <div class="trust-item">🔒 Safe Local Payments</div>
            <div class="trust-item">🎮 Tested Mods & Maps</div>
        </div>

        <main id="game-grid" class="game-grid">
            <p style="text-align: center; color: #94a3b8;">Loading games...</p>
        </main>

        <footer class="footer-note">
            Squad Games Store TZ &copy; 2026. All rights reserved.
        </footer>
    </div>

    <!-- Details Modal -->
    <div id="details-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModalDirect()">&times;</span>
            <h2 id="modal-title" style="margin-top: 0; font-size: 1.3rem;"></h2>
            <p id="modal-desc" style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;"></p>
            
            <div id="modal-gallery" class="gallery-grid"></div>

            <div style="margin-top: 10px;">
                <strong style="color: #007aff; font-size: 0.9rem;">⚙️ System Requirements:</strong>
                <div id="modal-req" class="req-box"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px;">
                <span id="modal-price" class="price"></span>
                <a id="modal-buy" href="#" target="_blank" class="btn-download">Buy Now</a>
            </div>
        </div>
    </div>

    <script>
        let currentGamesList = [];

        const fallbackGames = [
            {
                title: "Euro Truck Simulator 2 + 50 TZ Mods Pack",
                platform: "PC",
                category: "Simulation / PC",
                description: "Full Euro Truck Simulator 2 PC game bundled with 50 custom TZ mods.",
                requirements: "OS: Windows 10/11 (64-bit) | RAM: 8 GB | Storage: 25 GB | Graphics: GTX 660 / Intel HD 620",
                screenshots: ["ets-2-pc.jpg"],
                price: "TZS 30,000",
                image: "ets-2-pc.jpg",
                downloadUrl: "https://wa.me/255692752060?text=Hello%20Squad%20Games%2C%20I%20want%20to%20buy%20Euro%20Truck%20Simulator%202%20%2B%2050%20TZ%20Mods%20Pack%20(TZS%2030%2C000)."
            },
            {
                title: "Euro Truck Simulator 2 Mobile TZ",
                platform: "Android",
                category: "Mobile Games",
                description: "Experience driving heavy trucks across Tanzania directly on your Android phone.",
                requirements: "OS: Android 8.0+ | RAM: 4 GB minimum | Storage: 3 GB free space",
                screenshots: ["ets2-mobile.jpg"],
                price: "TZS 15,000",
                image: "ets2-mobile.jpg",
                downloadUrl: "https://wa.me/255692752060?text=Hello%20Squad%20Games%2C%20I%20want%20to%20buy%20Euro%20Truck%20Simulator%202%20Mobile%20TZ%20(TZS%2015%2C000)."
            },
            {
                title: "Euro Truck Simulator 2 v1.57.2.2s + 103 DLCs + Multiplayer Game",
                platform: "PC",
                category: "Open World / Simulation",
                description: "It includes 103 DLCs + Multiplayer Game",
                requirements: "OS: Windows 10/11 (64-bit) | RAM: 8 GB | Storage: 25 GB | Graphics: GTX 760 or equivalent",
                screenshots: ["ets 2 1.57.png"],
                price: "TZS 5,000",
                image: "ets 2 1.57.png",
                downloadUrl: "https://wa.me/255692752060?text=Hello%20Squad%20Games%2C%20I%20want%20to%20buy%20Euro%20Truck%20Simulator%202%20v1.57.2.2s%20%2B%20103%20DLCs%20%2B%20Multiplayer%20Game%20(TZS%205%2C000)."
            }
        ];

        function renderGames(data) {
            currentGamesList = data;
            const container = document.getElementById("game-grid");
            if (!container) return;
            container.innerHTML = "";

            data.forEach((game, index) => {
                const card = document.createElement("div");
                card.classList.add("game-card");
                card.innerHTML = `
                    <div class="card-badge">${game.platform || "Game"}</div>
                    <img src="${game.image}" 
                         alt="${game.title}" 
                         class="game-img" 
                         loading="lazy" 
                         onerror="this.src='https://via.placeholder.com/300x180?text=Image+Not+Found';" />
                    <div class="game-details">
                        <span class="category-tag">${game.category || ""}</span>
                        <h3>${game.title}</h3>
                        <p>${game.description || ""}</p>
                        <div class="card-action">
                            <span class="price">${game.price}</span>
                            <div class="action-group">
                                <button class="btn-details" onclick="showDetails(${index})">Details</button>
                                <a href="${game.downloadUrl}" target="_blank" class="btn-download">Buy Now</a>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showDetails(index) {
            const game = currentGamesList[index];
            if (!game) return;

            document.getElementById("modal-title").innerText = game.title;
            document.getElementById("modal-desc").innerText = game.description || "";
            document.getElementById("modal-req").innerText = game.requirements || "Standard System Requirements";
            document.getElementById("modal-price").innerText = game.price;
            document.getElementById("modal-buy").href = game.downloadUrl;

            const gallery = document.getElementById("modal-gallery");
            gallery.innerHTML = "";

            const imagesToDisplay = (game.screenshots && game.screenshots.length > 0) ? game.screenshots : [game.image];
            imagesToDisplay.forEach(imgSrc => {
                const imgEl = document.createElement("img");
                imgEl.src = imgSrc;
                imgEl.onerror = function() { this.style.display = 'none'; };
                gallery.appendChild(imgEl);
            });

            document.getElementById("details-modal").classList.add("active");
        }

        function closeModal(event) {
            if (event.target.classList.contains("modal-overlay")) {
                closeModalDirect();
            }
        }

        function closeModalDirect() {
            document.getElementById("details-modal").classList.remove("active");
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetch("./games.json")
                .then(response => {
                    if (!response.ok) throw new Error("Failed to load games.json");
                    return response.json();
                })
                .then(games => renderGames(games))
                .catch(err => {
                    console.warn("Using inline game fallback:", err);
                    renderGames(fallbackGames);
                });
        });
    </script>
</body>
</html>
