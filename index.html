<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Games Store TZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sleek Navigation Header -->
    <header class="navbar">
        <div class="brand">
            <img src="profile.jpg" alt="Profile" class="nav-avatar" onerror="this.style.display='none';" />
            <div class="brand-text">
                <span class="brand-title">Squad Games Store TZ</span>
                <span class="brand-sub">Download ETS 2 PC Mods, Maps & Mobile Games</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="https://wa.me/255692752060" target="_blank" class="nav-btn">WhatsApp Support</a>
        </nav>
    </header>

    <div class="container">
        <!-- Trust Indicators Bar -->
        <div class="trust-bar">
            <div class="trust-item">⚡ Instant WhatsApp Delivery</div>
            <div class="trust-item">🔒 Safe Local Payments</div>
            <div class="trust-item">🎮 Tested Mods & Maps</div>
        </div>

        <main id="game-grid" class="game-grid">
            <p style="text-align: center; color: #94a3b8;">Loading games...</p>
        </main>

        <footer class="footer-note">
            Squad Games Store TZ &copy; 2026. All rights reserved.
        </footer>
    </div>

    <script>
        const fallbackGames = [
            {
                title: "Euro Truck Simulator 2 - PC Edition",
                platform: "PC",
                category: "ETS 2 PC",
                description: "Full PC game download with high-end graphics and custom maps.",
                price: "TZS 30,000",
                image: "ets-2-pc.jpg",
                downloadUrl: "https://wa.me/255692752060?text=Hello%20Squad%20Games,%20I%20want%20to%20buy%20Euro%20Truck%20Simulator%202%20-%20PC%20Edition%20(TZS%2030,000)."
            },
            {
                title: "Euro Truck Simulator 2 - Mobile Edition",
                platform: "Android",
                category: "ETS 2 Mobile",
                description: "Mobile simulation folder containing regional maps, buses, and assets.",
                price: "TZS 15,000",
                image: "ets-2-mobile.jpg",
                downloadUrl: "https://wa.me/255692752060?text=Hello%20Squad%20Games,%20I%20want%20to%20buy%20Euro%20Truck%20Simulator%202%20-%20Mobile%20Edition%20(TZS%2015,000)."
            }
        ];

        function renderGames(data) {
            const container = document.getElementById("game-grid");
            if (!container) return;
            container.innerHTML = "";

            data.forEach(game => {
                const card = document.createElement("div");
                card.classList.add("game-card");
                card.innerHTML = `
                    <div class="card-badge">${game.platform || "Game"}</div>
                    <img src="${game.image}" 
                         alt="${game.title}" 
                         class="game-img" 
                         loading="lazy" 
                         onerror="this.src='https://via.placeholder.com/300x180?text=Image+Not+Found';" />
                    <div class="game-details">
                        <span class="category-tag">${game.category || ""}</span>
                        <h3>${game.title}</h3>
                        <p>${game.description || ""}</p>
                        <div class="card-action">
                            <span class="price">${game.price}</span>
                            <a href="${game.downloadUrl}" target="_blank" class="btn-download">Buy Now</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetch("./games.json")
                .then(response => {
                    if (!response.ok) throw new Error("Failed to load games.json");
                    return response.json();
                })
                .then(games => renderGames(games))
                .catch(err => {
                    console.warn("Using inline game fallback:", err);
                    renderGames(fallbackGames);
                });
        });
    </script>
</body>
</html>
