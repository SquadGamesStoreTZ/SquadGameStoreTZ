<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Games Store TZ | ETS 2 & Mobile Games</title>
    
    <!-- SEO & Open Graph Meta Tags -->
    <meta name="description" content="Buy Euro Truck Simulator 2, Tanzanian bus mods, and mobile games with instant delivery in Tanzania.">
    <meta name="keywords" content="Euro Truck Simulator 2, ETS2 Tanzania, ETS2 Mobile, Squad Games Store TZ">
    <meta property="og:title" content="Squad Games Store TZ">
    <meta property="og:description" content="Instant download via WhatsApp. Tanzanian maps, regional bus mods, and Android games.">
    <meta property="og:url" content="https://squadgamesstoretz.github.io/SquadGameStoreTZ/">
    <meta property="og:type" content="website">

    <!-- Base Fallback Styles & Variables -->
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #25d366;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 2rem;
            color: #ffffff;
        }
        .footer-note {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 25px;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
    </style>

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Squad Games Store TZ</h1>
            <p style="color: var(--text-muted); margin-top: 5px;">Download ETS 2 PC Mods, Maps & Mobile Games</p>
        </header>

        <!-- Dynamic Game Grid (Populated by script.js from games.json) -->
        <main id="game-grid" class="game-grid"></main>

        <footer class="footer-note">
            Squad Games Store TZ &copy; 2026. All rights reserved.
        </footer>
    </div>

    <!-- External JavaScript -->
    <script src="./script.js"></script>
</body>
</html>
